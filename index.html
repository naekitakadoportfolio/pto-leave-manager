<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTO Central · Leave Manager Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#EAF4FA;--bg2:#D7EAF5;--ink:#14384E;--mauve:#4F6E80;--cocoa:#1D4C93;--sky:#89CDE7;--card:rgba(255,255,255,.62);--line:rgba(20,56,78,.14);--blush:rgba(137,205,231,.22);--rose:#89CDE7;--ok-bg:#DDF1E4;--ok:#1E5A36;--warn-bg:#FCEBC8;--warn:#7A4E12;--bad-bg:#F8D7DA;--bad:#8A2C3A}
[data-theme=dark]{--bg1:#0B1E2A;--bg2:#14384E;--ink:#E6F2F8;--mauve:#9BB8C8;--card:rgba(20,56,78,.55);--line:rgba(137,205,231,.18);--blush:rgba(137,205,231,.12);--cocoa:#89CDE7;--ok-bg:rgba(46,160,90,.2);--ok:#8FE0AE;--warn-bg:rgba(230,160,40,.2);--warn:#F5C97A;--bad-bg:rgba(220,80,90,.2);--bad:#F5A3AC}
*{box-sizing:border-box}body{margin:0;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.topbar .brand{font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--mauve)}
.hero{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 8px 30px rgba(10,30,45,.08)}
.tag{display:inline-block;background:var(--blush);color:var(--cocoa);font-size:11px;letter-spacing:.14em;font-weight:700;border-radius:6px;padding:4px 10px}
h1{color:var(--ink);font-size:clamp(24px,4vw,34px);margin:10px 0 6px;font-weight:700}.hero p{margin:0;max-width:720px;color:var(--mauve)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(10,30,45,.06)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mauve);margin:0 0 12px;font-weight:700}
label{font-size:13px;font-weight:600;color:var(--mauve);display:block;margin:10px 0 4px}
select,textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:rgba(255,255,255,.7);color:#14384E}[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] input{background:rgba(255,255,255,.08);color:var(--ink)}
input[type=range],input[type=checkbox]{accent-color:#1D4C93}textarea{min-height:120px;resize:vertical}
button{background:#1D4C93;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;color:var(--cocoa);border:1px solid var(--line)}
.pill{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin:2px}
.high{background:var(--bad-bg);color:var(--bad)}.medium{background:var(--warn-bg);color:var(--warn)}.low{background:var(--ok-bg);color:var(--ok)}
ul{padding-left:18px;margin:6px 0}li{margin:4px 0}li::marker{color:var(--sky)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mauve);font-weight:600}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:120px;background:var(--blush);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--cocoa)}
pre{background:#0B1E2A;color:#CFE8F4;border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:320px}
footer{text-align:center;font-size:12px;color:var(--mauve);margin-top:28px}a{color:var(--cocoa)}.muted{color:var(--mauve);font-size:13px}
.hero:after{display:none}
</style><style>
.shell{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:4px}@media(max-width:820px){.shell{grid-template-columns:1fr}}
.side{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px;height:fit-content;position:sticky;top:12px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin:2px 0}
.side a.on{background:var(--cocoa);color:#fff}.side a:hover:not(.on){background:var(--blush)}
.badge{background:#C0392B;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.who{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:11px;font-weight:700;color:var(--mauve);text-align:center;letter-spacing:.08em}
.day{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:6px;background:rgba(255,255,255,.35);cursor:pointer;font-size:12px;overflow:hidden}
[data-theme=dark] .day{background:rgba(255,255,255,.04)}.day:hover{outline:2px solid var(--sky)}.day.off{opacity:.4}.day.we{background:var(--blush)}.day.today{outline:2px solid var(--cocoa)}.day.sel{background:rgba(29,76,147,.18)}
.ev{border-radius:5px;padding:1px 5px;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.Vacation{background:#1D4C93}.Sick{background:#C27C0E}.Personal{background:#2E8B57}.Protected{background:#6B7A86}.Holiday{background:#89CDE7;color:#14384E}.pending{opacity:.6;border:1px dashed #fff}
.toast{position:fixed;right:18px;bottom:18px;background:var(--cocoa);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;z-index:9;max-width:340px}.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}.modal.show{display:flex}.modal .card{max-width:480px;width:100%;background:var(--bg1)}
.row{display:flex;gap:10px}.row>*{flex:1}.legend span{margin-right:10px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bar{background:var(--blush);border-radius:99px;height:8px;margin-top:4px}.bar div{height:8px;border-radius:99px;background:var(--cocoa)}
</style></head><body><div class="wrap">
<div class="topbar"><span class="brand">PTO CENTRAL · DEMO</span><span><button class="ghost" style="margin:0;padding:6px 12px" onclick="resetAll()">↺ Reset demo data</button> <button class="ghost" id="themeBtn" style="margin:0;padding:6px 12px" onclick="toggleTheme()">🌙 Dark</button></span></div>
<div class="shell">
<nav class="side">
 <a href="#/dashboard" data-r="dashboard">🏠 Dashboard</a>
 <a href="#/calendar" data-r="calendar">📅 Team calendar</a>
 <a href="#/request" data-r="request">➕ Request leave</a>
 <a href="#/mine" data-r="mine">🗂 My requests</a>
 <a href="#/approvals" data-r="approvals">✅ Approvals <span class="badge" id="apBadge"></span></a>
 <a href="#/team" data-r="team">👥 Team & balances</a>
 <a href="#/policies" data-r="policies">⚙️ Leave policies</a>
 <a href="#/activity" data-r="activity">🔔 Activity & integrations</a>
 <div class="who"><label>Signed in as (demo)</label><select id="me" onchange="S.me=this.value;save();route()"></select><p class="muted" id="roleLbl"></p></div>
</nav>
<main id="view"></main></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="card" id="mbody"></div></div>
<div class="toast" id="toast"></div>
<script>
const SEED=()=>({me:"Ava Reyes",
 people:[{n:"Ava Reyes",role:"Employee",team:"Creative",mgr:"Marco Diaz"},{n:"Ben Cruz",role:"Employee",team:"Creative",mgr:"Marco Diaz"},{n:"Cara Lim",role:"Employee",team:"Data",mgr:"Marco Diaz"},{n:"Dev Patel",role:"Employee",team:"Ops",mgr:"Marco Diaz"},{n:"Marco Diaz",role:"Manager",team:"Creative",mgr:"Hana Sy"},{n:"Hana Sy",role:"HR",team:"People",mgr:""},{n:"Ivy Ong",role:"Admin",team:"Ops",mgr:""}],
 types:[{k:"Vacation",days:15,protected:false,color:"Vacation"},{k:"Sick",days:10,protected:false,color:"Sick"},{k:"Personal",days:3,protected:false,color:"Personal"},{k:"Medical",days:30,protected:true,color:"Protected"},{k:"Bereavement",days:5,protected:true,color:"Protected"}],
 holidays:{"2026-11-30":"Bonifacio Day","2026-12-08":"Immaculate Conception","2026-12-24":"Christmas Eve","2026-12-25":"Christmas Day","2026-12-30":"Rizal Day","2026-12-31":"New Year's Eve","2027-01-01":"New Year's Day"},
 req:[{id:1,n:"Ben Cruz",t:"Vacation",s:"2026-11-16",e:"2026-11-20",note:"Family trip",st:"approved",hist:["Submitted","Manager approved","HR approved"]},
      {id:2,n:"Cara Lim",t:"Medical",s:"2026-11-23",e:"2026-11-25",note:"",st:"approved",hist:["Submitted","Manager approved","HR approved"]},
      {id:3,n:"Dev Patel",t:"Vacation",s:"2026-11-18",e:"2026-11-19",note:"Moving apartments",st:"pending_mgr",hist:["Submitted"]},
      {id:4,n:"Ava Reyes",t:"Personal",s:"2026-11-27",e:"2026-11-27",note:"Errands",st:"pending_hr",hist:["Submitted","Manager approved"]},
      {id:5,n:"Ben Cruz",t:"Sick",s:"2026-11-03",e:"2026-11-03",note:"",st:"approved",hist:["Submitted","Manager approved","HR approved"]}],
 log:[{t:"Nov 3, 09:12",m:"📅 Calendar event created for Ben Cruz (Sick)"},{t:"Nov 3, 09:12",m:"💬 Posted to #out-of-office: Ben Cruz out Nov 3"}],nid:6,ym:"2026-11",minCover:2});
let S;try{S=JSON.parse(localStorage.getItem("ptoDemo"))||SEED()}catch(e){S=SEED()}
const save=()=>{try{localStorage.setItem("ptoDemo",JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),P=n=>S.people.find(p=>p.n==n),ME=()=>P(S.me),TY=k=>S.types.find(t=>t.k==k);
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function wdays(a,b){let n=0;for(let d=new Date(a+"T00:00");d<=new Date(b+"T00:00");d.setDate(d.getDate()+1)){const k=iso(d);if(d.getDay()%6&&!S.holidays[k])n++}return n}
function used(n,t){return S.req.filter(r=>r.n==n&&r.t==t&&r.st=="approved").reduce((a,r)=>a+wdays(r.s,r.e),0)}
function pend(n,t){return S.req.filter(r=>r.n==n&&r.t==t&&r.st.startsWith("pending")).reduce((a,r)=>a+wdays(r.s,r.e),0)}
function canSee(r){const me=ME();return r.n==me.n||["HR","Admin"].includes(me.role)}
function label(r){const t=TY(r.t);return t.protected&&!canSee(r)?"Time off":r.t}
function toast(m){const t=$("toast");t.innerHTML=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),3200)}
function L(m){S.log.unshift({t:new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}),m})}
const stPill=s=>({approved:'<span class="pill low">approved</span>',rejected:'<span class="pill high">rejected</span>',cancelled:'<span class="pill high">cancelled</span>',pending_mgr:'<span class="pill medium">awaiting manager</span>',pending_hr:'<span class="pill medium">awaiting HR</span>'}[s]);
function queue(){const me=ME();return S.req.filter(r=>(me.role=="Manager"&&r.st=="pending_mgr"&&P(r.n).mgr==me.n)||(["HR","Admin"].includes(me.role)&&r.st=="pending_hr"))}
function outOn(k,team){return S.req.filter(r=>r.st=="approved"&&r.s<=k&&r.e>=k&&(!team||P(r.n).team==team))}
function coverage(s,e,team,exclude){const size=S.people.filter(p=>p.team==team&&p.role=="Employee").length;let worst=size;for(let d=new Date(s+"T00:00");d<=new Date(e+"T00:00");d.setDate(d.getDate()+1)){const k=iso(d);if(d.getDay()%6==0)continue;const o=outOn(k,team).filter(r=>r.n!=exclude).length+1;worst=Math.min(worst,size-o)}return worst}
/* ---------- views ---------- */
const V={};
V.dashboard=()=>{const me=ME(),today="2026-11-05",out=outOn(today),up=S.req.filter(r=>r.st=="approved"&&r.s>today).sort((a,b)=>a.s<b.s?-1:1).slice(0,5),q=queue();
 return`<div class="hero"><span class="tag">WELCOME BACK</span><h1>Hi ${me.n.split(" ")[0]} 👋</h1><p>${me.role} · ${me.team} team. Here's who's out and what needs your attention.</p></div>
 <div class="card" style="margin-top:16px"><div class="kpi"><div><b>${TY("Vacation").days-used(me.n,"Vacation")}</b>vacation days left</div><div><b>${S.req.filter(r=>r.n==me.n&&r.st.startsWith("pending")).length}</b>my pending requests</div><div><b>${out.length}</b>out today</div><div><b>${q.length}</b>awaiting my approval</div></div></div>
 <div class="grid"><div class="card"><h2>Out today · ${fmt(today)}</h2>${out.length?out.map(r=>`<div>🏖 <b>${r.n}</b> · ${label(r)} until ${fmt(r.e)}</div>`).join(""):"<p class='muted'>Everyone's in today.</p>"}<h2 style="margin-top:14px">Coming up</h2>${up.map(r=>`<div style="padding:4px 0">📅 <b>${r.n}</b> · ${label(r)} · ${fmt(r.s)}–${fmt(r.e)}</div>`).join("")||"<p class='muted'>Nothing scheduled.</p>"}</div>
 <div class="card"><h2>Quick actions</h2><button onclick="location.hash='#/request'">➕ Request leave</button> <button class="ghost" onclick="location.hash='#/calendar'">📅 Open calendar</button>${q.length?` <button class="ghost" onclick="location.hash='#/approvals'">✅ Review ${q.length} request(s)</button>`:""}
 <h2 style="margin-top:16px">Upcoming holidays</h2>${Object.entries(S.holidays).filter(([k])=>k>=today).slice(0,4).map(([k,v])=>`<div>🎉 ${fmt(k)} · ${v}</div>`).join("")}</div></div>`};
V.calendar=()=>{const [y,m]=S.ym.split("-").map(Number),first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());const teamF=S.calTeam||"";let cells="";
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d),evs=S.req.filter(r=>!["rejected","cancelled"].includes(r.st)&&r.s<=k&&r.e>=k&&(!teamF||P(r.n).team==teamF));
  cells+=`<div class="day ${d.getMonth()!=m-1?"off":""} ${d.getDay()%6==0?"we":""} ${k=="2026-11-05"?"today":""}" onclick="dayClick('${k}')"><b>${d.getDate()}</b>${S.holidays[k]?`<div class="ev Holiday">🎉 ${S.holidays[k]}</div>`:""}${evs.map(r=>`<div class="ev ${TY(r.t).protected&&!canSee(r)?"Protected":TY(r.t).color} ${r.st!="approved"?"pending":""}" title="${r.n} · ${label(r)} (${r.st})">${r.n.split(" ")[0]} · ${label(r)}</div>`).join("")}</div>`}
 const teams=[...new Set(S.people.map(p=>p.team))];
 return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><button class="ghost" style="margin:0" onclick="mv(-1)">‹</button> <b style="font-size:18px;margin:0 10px">${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</b> <button class="ghost" style="margin:0" onclick="mv(1)">›</button></div>
 <div style="display:flex;gap:8px;align-items:center"><select style="width:auto" onchange="S.calTeam=this.value;save();route()"><option value="">All teams</option>${teams.map(t=>`<option ${t==teamF?"selected":""}>${t}</option>`).join("")}</select><button style="margin:0" onclick="location.hash='#/request'">➕ Request</button></div></div>
 <p class="legend muted" style="margin:10px 0"><span><i class="Vacation"></i>Vacation</span><span><i class="Sick"></i>Sick</span><span><i class="Personal"></i>Personal</span><span><i class="Protected"></i>Protected / private</span><span><i class="Holiday"></i>Holiday</span><span>Dashed = pending</span></p>
 <div class="cal">${["SUN","MON","TUE","WED","THU","FRI","SAT"].map(h=>`<div class="h">${h}</div>`).join("")}${cells}</div><p class="muted">Click any day to see who's out or start a request for that date.</p></div>`};
function mv(n){let [y,m]=S.ym.split("-").map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}S.ym=`${y}-${String(m).padStart(2,"0")}`;save();route()}
function dayClick(k){const o=S.req.filter(r=>!["rejected","cancelled"].includes(r.st)&&r.s<=k&&r.e>=k);
 openM(`<h2>${new Date(k+"T00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</h2>${S.holidays[k]?`<p>🎉 <b>${S.holidays[k]}</b> (public holiday, not counted as leave)</p>`:""}
 ${o.length?o.map(r=>`<div style="padding:4px 0">${r.n} · ${label(r)} ${stPill(r.st)}</div>`).join(""):"<p class='muted'>No one is out.</p>"}
 <button onclick="closeM();S.draft={s:'${k}',e:'${k}'};location.hash='#/request'">➕ Request leave from this day</button> <button class="ghost" onclick="closeM()">Close</button>`)}
V.request=()=>{const me=ME(),d=S.draft||{s:"2026-12-14",e:"2026-12-18"};
 return`<div class="grid"><div class="card"><h2>New leave request</h2>
 <label>Leave type</label><select id="rt" onchange="preview()">${S.types.map(t=>`<option value="${t.k}">${t.k}${t.protected?" 🔒 (private)":""}</option>`).join("")}</select>
 <div class="row"><div><label>Start</label><input type="date" id="rs" value="${d.s}" onchange="preview()"></div><div><label>End</label><input type="date" id="re" value="${d.e}" onchange="preview()"></div></div>
 <label>Note for your manager (optional)</label><textarea id="rn" style="min-height:70px" placeholder="e.g. Family trip, will hand off tasks to Ben"></textarea>
 <button onclick="submitReq()">SUBMIT REQUEST</button></div>
 <div class="card"><h2>Live checks</h2><div id="pv"></div></div></div>`};
function preview(){const me=ME(),t=TY($("rt").value),s=$("rs").value,e=$("re").value;if(!s||!e)return;
 if(e<s){$("pv").innerHTML='<span class="pill high">End date is before start date</span>';return}
 const n=wdays(s,e),left=t.days-used(me.n,t.k)-pend(me.n,t.k),hol=Object.entries(S.holidays).filter(([k])=>k>=s&&k<=e),cov=coverage(s,e,me.team,me.n),
 clash=S.req.filter(r=>r.n!=me.n&&P(r.n).team==me.team&&!["rejected","cancelled"].includes(r.st)&&!(r.e<s||r.s>e)),mine=S.req.filter(r=>r.n==me.n&&!["rejected","cancelled"].includes(r.st)&&!(r.e<s||r.s>e));
 $("pv").innerHTML=`<div class="kpi"><div><b>${n}</b>working days</div><div><b>${left}</b>${t.k} days available</div><div><b>${Math.max(left-n,0)}</b>left after this</div></div>
 <ul style="margin-top:12px">${n>left?`<li><span class="pill high">blocked</span> Not enough ${t.k} balance</li>`:`<li><span class="pill low">ok</span> Balance covers this request</li>`}
 ${mine.length?`<li><span class="pill high">blocked</span> Overlaps your own request (${fmt(mine[0].s)})</li>`:""}
 ${hol.length?`<li><span class="pill low">info</span> ${hol.map(h=>h[1]).join(", ")} excluded (holiday)</li>`:""}
 ${clash.length?`<li><span class="pill medium">heads-up</span> ${clash.map(c=>c.n.split(" ")[0]).join(", ")} also out in ${me.team}</li>`:""}
 ${cov<S.minCover?`<li><span class="pill medium">coverage</span> ${me.team} drops to ${Math.max(cov,0)} people (min ${S.minCover}); manager will be warned</li>`:`<li><span class="pill low">ok</span> Team coverage stays healthy</li>`}
 ${t.protected?`<li><span class="pill low">privacy</span> Teammates will only see "Time off"</li>`:""}
 <li class="muted">Approval path: ${me.mgr||"HR"} → HR</li></ul>`;return{n,left,mine}}
function submitReq(){const me=ME(),c=preview();if(!c||c.n<=0)return toast("Pick valid working days.");if(c.n>c.left)return toast("⛔ Not enough balance.");if(c.mine.length)return toast("⛔ You already have leave on those dates.");
 const r={id:S.nid++,n:me.n,t:$("rt").value,s:$("rs").value,e:$("re").value,note:$("rn").value,st:me.role=="Employee"?"pending_mgr":"pending_hr",hist:["Submitted"]};S.req.push(r);delete S.draft;
 L(`📨 ${me.n} requested ${label(r)} ${fmt(r.s)}–${fmt(r.e)} · email + chat sent to ${me.role=="Employee"?me.mgr:"HR"}`);save();toast("✅ Request submitted");location.hash="#/mine"}
V.mine=()=>{const me=ME(),rs=S.req.filter(r=>r.n==me.n).sort((a,b)=>a.s<b.s?1:-1);
 return`<div class="card"><h2>My requests</h2>${rs.length?`<table><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Timeline</th><th></th></tr>${rs.map(r=>`<tr><td>${r.t}</td><td>${fmt(r.s)} – ${fmt(r.e)}</td><td>${wdays(r.s,r.e)}</td><td>${stPill(r.st)}</td><td class="muted">${r.hist.join(" → ")}</td><td>${r.st.startsWith("pending")||(r.st=="approved"&&r.s>"2026-11-05")?`<button class="ghost" style="margin:0;padding:5px 10px" onclick="cancelReq(${r.id})">Cancel</button>`:""}</td></tr>`).join("")}</table>`:"<p class='muted'>No requests yet.</p>"}</div>`};
function cancelReq(id){const r=S.req.find(x=>x.id==id);r.st="cancelled";r.hist.push("Cancelled by employee");L(`🗑 ${r.n} cancelled ${label(r)} ${fmt(r.s)} · calendar event removed`);save();toast("Request cancelled");route()}
V.approvals=()=>{const me=ME(),q=queue();if(!["Manager","HR","Admin"].includes(me.role))return`<div class="card"><h2>Approvals</h2><p class="muted">Only managers and HR can approve. Switch the "Signed in as" user to <b>Marco Diaz</b> (Manager) or <b>Hana Sy</b> (HR).</p></div>`;
 return`<div class="card"><h2>${me.role=="Manager"?"Step 1 · Manager approval":"Step 2 · HR approval"} (${q.length})</h2>${q.length?q.map(r=>{const p=P(r.n),cov=coverage(r.s,r.e,p.team,r.n);return`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0"><b>${r.n}</b> · ${p.team} · <b>${r.t}</b>${TY(r.t).protected?' <span class="pill medium">protected</span>':""}<br>${fmt(r.s)} – ${fmt(r.e)} · ${wdays(r.s,r.e)} working days ${r.note?`<br><span class="muted">“${r.note}”</span>`:""}
 <br>${cov<S.minCover?`<span class="pill high">coverage risk: ${p.team} drops to ${Math.max(cov,0)}</span>`:'<span class="pill low">coverage ok</span>'} <span class="pill low">balance after: ${TY(r.t).days-used(r.n,r.t)-wdays(r.s,r.e)} days</span>
 <div><button onclick="decide(${r.id},1)">Approve</button> <button class="ghost" onclick="decide(${r.id},0)">Reject</button></div></div>`}).join(""):"<p class='muted'>🎉 You're all caught up.</p>"}</div>`};
function decide(id,ok){const r=S.req.find(x=>x.id==id),me=ME();
 if(!ok){openM(`<h2>Reject request</h2><label>Reason (sent to ${r.n})</label><textarea id="why" style="min-height:70px">Team coverage is too low that week.</textarea><button onclick="(()=>{const r=S.req.find(x=>x.id==${id});r.st='rejected';r.hist.push('Rejected by ${me.n}: '+why.value);L('❌ ${me.n} rejected ${r.n}\\'s request · email sent');save();closeM();toast('Request rejected');route()})()">Reject</button> <button class="ghost" onclick="closeM()">Cancel</button>`);return}
 if(r.st=="pending_mgr"){r.st="pending_hr";r.hist.push("Manager approved");L(`✅ ${me.n} approved ${r.n} → sent to HR`);toast("Approved · forwarded to HR")}
 else{r.st="approved";r.hist.push("HR approved");L(`✅ HR approved ${r.n} · ${label(r)} ${fmt(r.s)}–${fmt(r.e)}`);L(`📅 Calendar event created · 💬 posted to #out-of-office · 🔄 synced to HRIS · ✉️ confirmation emailed`);toast("Approved · calendar & chat updated")}
 save();route()}
V.team=()=>{const me=ME(),full=["HR","Admin","Manager"].includes(me.role);
 return`<div class="card"><h2>Team & balances</h2>${!full?"<p class='muted'>Employees see their own balances only. Switch to a manager or HR user to see everyone.</p>":""}<table><tr><th>Person</th><th>Team</th><th>Role</th>${S.types.filter(t=>!t.protected||me.role!="Manager").map(t=>`<th>${t.k}</th>`).join("")}</tr>
 ${S.people.filter(p=>full||p.n==me.n).map(p=>`<tr><td>${p.n}</td><td>${p.team}</td><td>${p.role}</td>${S.types.filter(t=>!t.protected||me.role!="Manager").map(t=>{const u=used(p.n,t.k);return`<td>${t.days-u}/${t.days}<div class="bar"><div style="width:${(t.days-u)/t.days*100}%"></div></div></td>`}).join("")}</tr>`).join("")}</table></div>`};
V.policies=()=>{const me=ME(),edit=["HR","Admin"].includes(me.role);
 return`<div class="grid"><div class="card"><h2>Leave types</h2><table><tr><th>Type</th><th>Days / year</th><th>Private</th></tr>${S.types.map((t,i)=>`<tr><td>${t.k}</td><td>${edit?`<input type="number" value="${t.days}" style="width:80px" onchange="S.types[${i}].days=+this.value;L('⚙️ ${me.n} set ${t.k} allowance to '+this.value);save();toast('Policy updated')">`:t.days}</td><td>${edit?`<input type="checkbox" style="width:auto" ${t.protected?"checked":""} onchange="S.types[${i}].protected=this.checked;S.types[${i}].color=this.checked?'Protected':'${t.k}';save();toast('Privacy updated')">`:t.protected?"🔒":"—"}</td></tr>`).join("")}</table>
 ${edit?`<label>Minimum team coverage (people in)</label><input type="number" value="${S.minCover}" onchange="S.minCover=+this.value;save();toast('Coverage rule updated')">`:"<p class='muted'>Only HR and Admin can edit policies.</p>"}</div>
 <div class="card"><h2>Public holidays</h2>${Object.entries(S.holidays).map(([k,v])=>`<div>🎉 ${fmt(k)} · ${v}</div>`).join("")}${edit?`<div class="row" style="margin-top:10px"><input type="date" id="hd"><input id="hn" placeholder="Holiday name"></div><button class="ghost" onclick="if(hd.value&&hn.value){S.holidays[hd.value]=hn.value;save();toast('Holiday added');route()}">Add holiday</button>`:""}</div></div>`};
V.activity=()=>`<div class="card"><h2>Activity & integrations</h2><p class="muted">In production these fire real events: calendar, chat channel, email and HRIS sync.</p>${S.log.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted">${l.t}</span> · ${l.m}</div>`).join("")}</div>`;
/* ---------- shell ---------- */
function openM(h){$("mbody").innerHTML=h;$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}
function route(){const r=(location.hash.replace("#/","")||"dashboard");document.querySelectorAll(".side a").forEach(a=>a.classList.toggle("on",a.dataset.r==r));
 $("view").innerHTML=(V[r]||V.dashboard)();if(r=="request")preview();const q=queue().length;$("apBadge").textContent=q||"";$("apBadge").style.display=q?"":"none";
 $("me").innerHTML=S.people.map(p=>`<option ${p.n==S.me?"selected":""}>${p.n}</option>`).join("");$("roleLbl").textContent=`${ME().role} · ${ME().team}`;window.scrollTo(0,0)}
function resetAll(){S=SEED();save();toast("Demo data reset");location.hash="#/dashboard";route()}
function toggleTheme(){const h=document.documentElement,n=h.dataset.theme=="dark"?"light":"dark";h.dataset.theme=n;try{localStorage.setItem("demoTheme",n)}catch(e){}$("themeBtn").textContent=n=="dark"?"☀️ Light":"🌙 Dark"}
try{const t=localStorage.getItem("demoTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;$("themeBtn").textContent=t=="dark"?"☀️ Light":"🌙 Dark"}catch(e){}
addEventListener("hashchange",route);route();
</script>
